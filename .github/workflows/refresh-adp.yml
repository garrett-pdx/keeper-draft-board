name: Refresh ADP and outlook data

on:
  schedule:
    # Daily, 13:00 UTC (~6am Pacific / 9am Eastern). FFC recomputes its ADP
    # roughly daily over a rolling window of recent drafts (confirmed live: the
    # half-ppr/10-team set reported a 6-day window), so a twice-weekly refresh
    # meant the app could sit 3-4 days behind data that had already moved on.
    # Once a day matches the source's own cadence without hammering it.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-adp
      # One request a day against an API whose own terms invite this use. Marked
      # continue-on-error so an MFL hiccup can't take the other three snapshots
      # down with it — the app already falls back to another real source when
      # one is missing, and a stale MFL snapshot is better than no refresh at all.
      - run: npm run fetch-mfl-adp
        continue-on-error: true
      - run: npm run fetch-outlooks
      - run: npm run fetch-values
      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/adp-snapshot.json public/adp-real-snapshot.json public/outlook-snapshot.json public/value-snapshot.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Refresh ADP, value and outlook snapshots"
          git push
